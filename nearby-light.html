<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Light Status — Nearby</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --cream:#F5F0E8;--warm:#FDFAF4;--terracotta:#C4622D;--terra-light:#E07A4A;
  --navy:#1A2332;--sage:#7A9E7E;--amber:#E8A838;--mid:#4A5568;--light:#8A96A8;
  --on:#22C55E;--on-bg:#F0FDF4;--on-border:#BBF7D0;
  --off:#EF4444;--off-bg:#FEF2F2;--off-border:#FECACA;
  --flicker:#F59E0B;--flicker-bg:#FFFBEB;--flicker-border:#FDE68A;
}
body{background:var(--cream);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:80px;}

/* HEADER */
.header{background:var(--navy);padding:16px 16px 0;position:sticky;top:0;z-index:100;}
.header-inner{max-width:480px;margin:0 auto;}
.top-row{display:flex;align-items:center;gap:10px;padding-bottom:14px;}
.back-btn{background:none;border:none;color:rgba(255,255,255,.7);font-size:22px;cursor:pointer;padding:4px;}
.page-title{font-family:'Playfair Display',serif;font-size:20px;color:#fff;font-weight:700;flex:1;}
.live-dot{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--on);font-weight:600;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--on);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* NEIGHBORHOOD SELECTOR */
.hood-bar{background:rgba(255,255,255,.08);border-top:1px solid rgba(255,255,255,.08);padding:10px 0;}
.hood-select{background:none;border:none;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;
  font-weight:600;width:100%;outline:none;cursor:pointer;padding:0;}
.hood-select option{background:var(--navy);color:#fff;}

/* CONTENT */
.content{max-width:480px;margin:0 auto;padding:16px;}

/* BIG STATUS CARD */
.status-card{border-radius:20px;padding:24px 20px;margin-bottom:16px;text-align:center;
  border:2px solid transparent;transition:all .4s;position:relative;overflow:hidden;}
.status-card.on{background:var(--on-bg);border-color:var(--on-border);}
.status-card.off{background:var(--off-bg);border-color:var(--off-border);}
.status-card.fluctuating{background:var(--flicker-bg);border-color:var(--flicker-border);}
.status-card.unknown{background:var(--warm);border-color:rgba(0,0,0,.1);}

.status-icon{font-size:52px;margin-bottom:10px;display:block;
  animation:none;}
.status-card.on .status-icon{animation:glow 2s infinite;}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 8px rgba(34,197,94,.5));}50%{filter:drop-shadow(0 0 16px rgba(34,197,94,.9));}}

.status-word{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;margin-bottom:6px;}
.status-card.on .status-word{color:#16A34A;}
.status-card.off .status-word{color:#DC2626;}
.status-card.fluctuating .status-word{color:#D97706;}
.status-card.unknown .status-word{color:var(--light);}

.status-hood{font-size:14px;color:var(--mid);margin-bottom:4px;}
.status-duration{font-size:13px;font-weight:600;color:var(--mid);}
.status-reporter{font-size:12px;color:var(--light);margin-top:6px;}
.status-note{font-size:13px;color:var(--mid);margin-top:8px;font-style:italic;
  background:rgba(0,0,0,.04);border-radius:10px;padding:8px 12px;}

/* CONFIRM STRIP */
.confirm-strip{display:flex;align-items:center;justify-content:space-between;
  background:rgba(0,0,0,.04);border-radius:12px;padding:10px 14px;margin-top:12px;}
.confirm-count{font-size:13px;color:var(--mid);}
.confirm-count b{color:var(--navy);}
.confirm-btn{background:var(--navy);color:#fff;border:none;border-radius:10px;
  padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.confirm-btn:active{transform:scale(.96);}
.confirm-btn.done{background:var(--sage);}

/* REPORT BUTTONS */
.report-section{margin-bottom:16px;}
.report-label{font-size:11px;font-weight:700;color:var(--light);letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:10px;}
.report-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.rpt-btn{border:none;border-radius:14px;padding:14px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .2s;border:2px solid transparent;}
.rpt-btn:active{transform:scale(.96);}
.rpt-btn .rb-icon{font-size:24px;}
.rpt-btn .rb-label{font-size:12px;font-weight:700;}
.rpt-on{background:var(--on-bg);color:#16A34A;border-color:var(--on-border);}
.rpt-off{background:var(--off-bg);color:#DC2626;border-color:var(--off-border);}
.rpt-flicker{background:var(--flicker-bg);color:#D97706;border-color:var(--flicker-border);}

/* OPTIONAL NOTE */
.note-wrap{margin-bottom:16px;display:none;}
.note-wrap.show{display:block;}
.note-input{width:100%;background:var(--warm);border:1.5px solid rgba(0,0,0,.1);
  border-radius:12px;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:14px;
  color:var(--navy);outline:none;resize:none;}
.note-input:focus{border-color:var(--terracotta);}
.note-submit{width:100%;background:var(--terracotta);color:#fff;border:none;border-radius:12px;
  padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;}

/* OTHER NEIGHBORHOODS */
.section-label{font-size:11px;font-weight:700;color:var(--light);letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:10px;}
.area-row{background:var(--warm);border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;margin-bottom:6px;border:1px solid rgba(0,0,0,.06);}
.area-status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.dot-on{background:var(--on);}
.dot-off{background:var(--off);}
.dot-flicker{background:var(--flicker);}
.dot-unknown{background:#D1D5DB;}
.area-name{font-size:14px;font-weight:600;color:var(--navy);flex:1;}
.area-time{font-size:11px;color:var(--light);}
.area-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px;}
.ab-on{background:var(--on-bg);color:#16A34A;}
.ab-off{background:var(--off-bg);color:#DC2626;}
.ab-flicker{background:var(--flicker-bg);color:#D97706;}
.ab-unknown{background:var(--cream);color:var(--light);}

/* HISTORY */
.history-card{background:var(--warm);border-radius:12px;padding:12px 14px;
  margin-bottom:8px;border:1px solid rgba(0,0,0,.06);}
.history-row{display:flex;align-items:flex-start;gap:10px;}
.history-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.history-body{flex:1;}
.history-status{font-size:13px;font-weight:700;}
.history-status.on{color:#16A34A;}
.history-status.off{color:#DC2626;}
.history-status.fluctuating{color:#D97706;}
.history-meta{font-size:11px;color:var(--light);margin-top:2px;}
.history-note{font-size:12px;color:var(--mid);margin-top:4px;font-style:italic;}
.history-confirms{font-size:11px;color:var(--light);margin-top:3px;}

/* PATTERN CHART */
.pattern-card{background:var(--warm);border-radius:14px;padding:14px;margin-bottom:16px;border:1px solid rgba(0,0,0,.06);}
.pattern-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px;}
.pattern-grid{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-bottom:6px;}
.pattern-cell{height:20px;border-radius:3px;background:rgba(0,0,0,.08);}
.pattern-cell.on{background:var(--on);}
.pattern-cell.off{background:var(--off);}
.pattern-cell.flicker{background:var(--flicker);}
.pattern-legend{display:flex;gap:12px;font-size:10px;color:var(--light);}
.pl-item{display:flex;align-items:center;gap:4px;}
.pl-dot{width:8px;height:8px;border-radius:2px;}

/* SHARE BUTTON */
.share-btn{width:100%;background:var(--warm);border:1.5px solid rgba(0,0,0,.1);
  border-radius:12px;padding:12px;font-size:14px;font-weight:600;color:var(--mid);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* LOADING */
.spinner{display:inline-block;width:24px;height:24px;border:3px solid rgba(196,98,45,.2);
  border-top-color:var(--terracotta);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);
  display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;
  color:rgba(255,255,255,0.5);font-size:10px;font-weight:600;
  text-decoration:none;gap:3px;transition:color .2s;}
.nav-item.active{color:var(--terra-light);}
.nav-icon{font-size:20px;line-height:1;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="top-row">
      <button class="back-btn" onclick="history.back()">←</button>
      <div class="page-title">⚡ Light Status</div>
      <div class="live-dot"><div class="dot"></div>LIVE</div>
    </div>
    <div class="hood-bar">
      <select class="hood-select" id="hoodSelect" onchange="changeHood()">
        <option value="">Loading neighborhoods…</option>
      </select>
    </div>
  </div>
</div>

<div class="content">

  <!-- BIG STATUS CARD -->
  <div class="status-card unknown" id="statusCard">
    <span class="status-icon" id="statusIcon">⚡</span>
    <div class="status-word" id="statusWord">Loading…</div>
    <div class="status-hood" id="statusHood"></div>
    <div class="status-duration" id="statusDuration"></div>
    <div class="status-reporter" id="statusReporter"></div>
    <div class="status-note" id="statusNote" style="display:none;"></div>
    <div class="confirm-strip" id="confirmStrip">
      <span class="confirm-count"><b id="confirmCount">0</b> neighbors confirmed</span>
      <button class="confirm-btn" id="confirmBtn" onclick="confirmStatus()">👍 Confirm</button>
    </div>
  </div>

  <!-- REPORT BUTTONS -->
  <div class="report-section">
    <div class="report-label">Update your neighborhood</div>
    <div class="report-btns">
      <button class="rpt-btn rpt-on" onclick="startReport('on')">
        <span class="rb-icon">💡</span>
        <span class="rb-label">Light On</span>
      </button>
      <button class="rpt-btn rpt-off" onclick="startReport('off')">
        <span class="rb-icon">🌑</span>
        <span class="rb-label">Light Off</span>
      </button>
      <button class="rpt-btn rpt-flicker" onclick="startReport('fluctuating')">
        <span class="rb-icon">⚡</span>
        <span class="rb-label">Flickering</span>
      </button>
    </div>
  </div>

  <!-- NOTE INPUT -->
  <div class="note-wrap" id="noteWrap">
    <textarea class="note-input" id="noteInput" rows="2" placeholder="Add a note (optional) — e.g. 'PHCN van was here earlier'"></textarea>
    <button class="note-submit" id="noteSubmit" onclick="submitReport()">📡 Submit Report</button>
  </div>

  <!-- 24HR PATTERN -->
  <div class="pattern-card" id="patternCard" style="display:none;">
    <div class="pattern-title">📊 Last 24 hours in <span id="patternHood"></span></div>
    <div class="pattern-grid" id="patternGrid"></div>
    <div class="pattern-legend">
      <div class="pl-item"><div class="pl-dot" style="background:var(--on)"></div>On</div>
      <div class="pl-item"><div class="pl-dot" style="background:var(--off)"></div>Off</div>
      <div class="pl-item"><div class="pl-dot" style="background:var(--flicker)"></div>Flickering</div>
      <div class="pl-item"><div class="pl-dot" style="background:rgba(0,0,0,.08)"></div>No data</div>
    </div>
  </div>

  <!-- SHARE -->
  <button class="share-btn" onclick="shareStatus()">📤 Share light status on WhatsApp</button>

  <!-- OTHER NEIGHBORHOODS -->
  <div class="section-label">Other neighborhoods</div>
  <div id="otherAreas"></div>

  <!-- HISTORY -->
  <div class="section-label" style="margin-top:16px;">Recent reports</div>
  <div id="historyList"></div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="nav-item" href="nearby-feed.html"><span class="nav-icon">🏠</span>Home</a>
  <a class="nav-item" href="nearby-search.html"><span class="nav-icon">🔍</span>Search</a>
  <a class="nav-item active" href="nearby-light.html"><span class="nav-icon">⚡</span>Light</a>
  <a class="nav-item" href="nearby-messages.html"><span class="nav-icon">💬</span>Messages</a>
  <a class="nav-item" href="nearby-profile.html"><span class="nav-icon">👤</span>Profile</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="nearby-push.js"></script>
<script>
var currentUser = null;
var currentHood = '';
var currentCity = '';
var pendingStatus = null;
var currentReportId = null;
var realtimeChannel = null;

// ── INIT ────────────────────────────────────────────────────
async function init() {
  var session = await getSession();
  if (!session) { window.location.href = 'nearby-auth.html'; return; }
  currentUser = await getCurrentUser();

  if (currentUser) {
    currentHood = currentUser.neighborhood || '';
    currentCity = currentUser.city || '';
  }

  await loadHoodSelector();
  await loadStatus();
  await loadOtherAreas();
  await loadHistory();
  startRealtime();
}

// ── HOOD SELECTOR ────────────────────────────────────────────
async function loadHoodSelector() {
  var res = await sb.from('light_status').select('neighborhood,city').order('neighborhood');
  var select = document.getElementById('hoodSelect');
  var options = '<option value="">— Select neighborhood —</option>';

  // Always include user's own hood first
  if (currentHood) {
    options += '<option value="' + currentHood + '" ' + (true ? 'selected' : '') + '>' + currentHood + (currentCity ? ', ' + currentCity : '') + ' (Mine)</option>';
  }

  if (res.data) {
    for (var i = 0; i < res.data.length; i++) {
      var d = res.data[i];
      if (d.neighborhood !== currentHood) {
        options += '<option value="' + d.neighborhood + '">' + d.neighborhood + (d.city ? ', ' + d.city : '') + '</option>';
      }
    }
  }
  select.innerHTML = options;
}

function changeHood() {
  var sel = document.getElementById('hoodSelect');
  currentHood = sel.value;
  loadStatus();
  loadHistory();
}

// ── LOAD STATUS ──────────────────────────────────────────────
async function loadStatus() {
  if (!currentHood) {
    renderStatus(null);
    return;
  }

  var res = await sb.from('light_status')
    .select('*')
    .eq('neighborhood', currentHood)
    .single();

  renderStatus(res.data || null);
  buildPattern(res.data);
}

function renderStatus(data) {
  var card = document.getElementById('statusCard');
  var icon = document.getElementById('statusIcon');
  var word = document.getElementById('statusWord');
  var hood = document.getElementById('statusHood');
  var dur  = document.getElementById('statusDuration');
  var rep  = document.getElementById('statusReporter');
  var note = document.getElementById('statusNote');
  var cnt  = document.getElementById('confirmCount');

  card.className = 'status-card ' + (data ? data.status : 'unknown');

  if (!data) {
    icon.textContent = '❓';
    word.textContent = 'No reports yet';
    hood.textContent = currentHood || 'Select a neighborhood above';
    dur.textContent = '';
    rep.textContent = 'Be the first to report!';
    note.style.display = 'none';
    cnt.textContent = '0';
    return;
  }

  var statusMap = {
    on: { icon: '💡', word: 'Light is ON', },
    off: { icon: '🌑', word: 'Light is OFF', },
    fluctuating: { icon: '⚡', word: 'Flickering', },
    unknown: { icon: '❓', word: 'Unknown', }
  };
  var s = statusMap[data.status] || statusMap.unknown;
  icon.textContent = s.icon;
  word.textContent = s.word;
  hood.textContent = data.neighborhood + (data.city ? ', ' + data.city : '');
  dur.textContent = 'Reported ' + timeAgo(data.updated_at);
  rep.textContent = data.reporter_name ? 'by ' + data.reporter_name : '';
  cnt.textContent = data.confirmations || 0;

  if (data.note) {
    note.textContent = '"' + data.note + '"';
    note.style.display = 'block';
  } else {
    note.style.display = 'none';
  }
}

// ── REPORT ───────────────────────────────────────────────────
function startReport(status) {
  pendingStatus = status;
  var wrap = document.getElementById('noteWrap');
  var btn  = document.getElementById('noteSubmit');
  wrap.classList.add('show');

  var labels = { on: '💡 Report Light ON', off: '🌑 Report Light OFF', fluctuating: '⚡ Report Flickering' };
  btn.textContent = labels[status] || 'Submit Report';
  document.getElementById('noteInput').value = '';
  document.getElementById('noteInput').focus();

  wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function submitReport() {
  if (!pendingStatus) return;
  if (!currentHood) { showToast('Select your neighborhood first'); return; }

  var note = document.getElementById('noteInput').value.trim();
  document.getElementById('noteSubmit').textContent = 'Sending…';

  try {
    var res = await sb.from('light_reports').insert({
      user_id: currentUser.id,
      neighborhood: currentHood,
      city: currentCity,
      status: pendingStatus,
      note: note || null
    }).select().single();

    currentReportId = res.data ? res.data.id : null;

    document.getElementById('noteWrap').classList.remove('show');
    pendingStatus = null;

    var msgs = {
      on: '💡 Light ON reported!',
      off: '🌑 Light OFF reported!',
      fluctuating: '⚡ Flickering reported!'
    };
    showToast(msgs[res.data.status] || 'Report sent!');

    // Notify neighborhood via push
    try {
      NearbyPush.show(
        'Light Update — ' + currentHood,
        msgs[res.data.status],
        '⚡'
      );
    } catch(e) {}

    await loadStatus();
    await loadHistory();
    await loadOtherAreas();
    loadHoodSelector();

  } catch(e) {
    showToast('Error: ' + (e.message || 'Try again'));
    document.getElementById('noteSubmit').textContent = 'Submit Report';
  }
}

// ── CONFIRM ──────────────────────────────────────────────────
async function confirmStatus() {
  if (!currentReportId) {
    // Get latest report id for this hood
    var r = await sb.from('light_reports')
      .select('id')
      .eq('neighborhood', currentHood)
      .order('created_at', { ascending: false })
      .limit(1)
      .single();
    if (!r.data) { showToast('Nothing to confirm yet'); return; }
    currentReportId = r.data.id;
  }

  try {
    await sb.rpc('confirm_light_report', {
      p_report_id: currentReportId,
      p_user_id: currentUser.id
    });
    document.getElementById('confirmBtn').textContent = '✅ Confirmed';
    document.getElementById('confirmBtn').classList.add('done');
    var cur = parseInt(document.getElementById('confirmCount').textContent) || 0;
    document.getElementById('confirmCount').textContent = cur + 1;
    showToast('✅ Confirmation added!');
  } catch(e) {
    showToast('Already confirmed or error');
  }
}

// ── OTHER AREAS ───────────────────────────────────────────────
async function loadOtherAreas() {
  var res = await sb.from('light_status')
    .select('*')
    .order('updated_at', { ascending: false })
    .limit(10);

  if (!res.data || !res.data.length) {
    document.getElementById('otherAreas').innerHTML = '<p style="color:var(--light);font-size:13px;padding:8px 0;">No reports from other areas yet</p>';
    return;
  }

  var dotClass = { on: 'dot-on', off: 'dot-off', fluctuating: 'dot-flicker', unknown: 'dot-unknown' };
  var badgeClass = { on: 'ab-on', off: 'ab-off', fluctuating: 'ab-flicker', unknown: 'ab-unknown' };
  var badgeText = { on: '💡 ON', off: '🌑 OFF', fluctuating: '⚡ Flicker', unknown: '❓ Unknown' };

  var html = '';
  for (var i = 0; i < res.data.length; i++) {
    var d = res.data[i];
    if (d.neighborhood === currentHood) continue;
    html += '<div class="area-row" onclick="selectArea(\'' + d.neighborhood + '\')">'
      + '<div class="area-status-dot ' + (dotClass[d.status] || 'dot-unknown') + '"></div>'
      + '<div class="area-name">' + d.neighborhood + (d.city ? '<br><span style="font-size:11px;color:var(--light);font-weight:400">' + d.city + '</span>' : '') + '</div>'
      + '<div style="text-align:right;">'
      + '<span class="area-badge ' + (badgeClass[d.status] || 'ab-unknown') + '">' + (badgeText[d.status] || '❓') + '</span>'
      + '<div class="area-time">' + timeAgo(d.updated_at) + '</div>'
      + '</div>'
      + '</div>';
  }
  document.getElementById('otherAreas').innerHTML = html || '<p style="color:var(--light);font-size:13px;">No other areas reporting yet</p>';
}

function selectArea(hood) {
  currentHood = hood;
  var sel = document.getElementById('hoodSelect');
  for (var i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === hood) { sel.selectedIndex = i; break; }
  }
  loadStatus();
  loadHistory();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── HISTORY ───────────────────────────────────────────────────
async function loadHistory() {
  if (!currentHood) return;
  var res = await sb.from('light_reports')
    .select('*')
    .eq('neighborhood', currentHood)
    .order('created_at', { ascending: false })
    .limit(15);

  if (!res.data || !res.data.length) {
    document.getElementById('historyList').innerHTML = '<p style="color:var(--light);font-size:13px;padding:8px 0;">No reports yet — be the first!</p>';
    return;
  }

  var html = '';
  for (var i = 0; i < res.data.length; i++) {
    var r = res.data[i];
    var dotCol = r.status === 'on' ? 'var(--on)' : r.status === 'off' ? 'var(--off)' : 'var(--flicker)';
    var statusLabel = r.status === 'on' ? '💡 Light came ON' : r.status === 'off' ? '🌑 Light went OFF' : '⚡ Flickering';
    html += '<div class="history-card">'
      + '<div class="history-row">'
      + '<div class="history-dot" style="background:' + dotCol + '"></div>'
      + '<div class="history-body">'
      + '<div class="history-status ' + r.status + '">' + statusLabel + '</div>'
      + '<div class="history-meta">' + timeAgo(r.created_at) + '</div>'
      + (r.note ? '<div class="history-note">"' + r.note + '"</div>' : '')
      + (r.confirmations ? '<div class="history-confirms">👍 ' + r.confirmations + ' confirmed</div>' : '')
      + '</div>'
      + '</div>'
      + '</div>';
  }
  document.getElementById('historyList').innerHTML = html;
}

// ── 24HR PATTERN ─────────────────────────────────────────────
async function buildPattern(currentData) {
  if (!currentHood) return;
  var since = new Date(Date.now() - 24*60*60*1000).toISOString();
  var res = await sb.from('light_reports')
    .select('status,created_at')
    .eq('neighborhood', currentHood)
    .gte('created_at', since)
    .order('created_at', { ascending: true });

  document.getElementById('patternCard').style.display = 'block';
  document.getElementById('patternHood').textContent = currentHood;

  var reports = res.data || [];
  var cells = '';
  var now = Date.now();

  for (var h = 23; h >= 0; h--) {
    var slotEnd = now - h * 60 * 60 * 1000;
    var slotStart = slotEnd - 60 * 60 * 1000;
    var slotStatus = 'unknown';

    for (var j = reports.length - 1; j >= 0; j--) {
      var t = new Date(reports[j].created_at).getTime();
      if (t >= slotStart && t < slotEnd) {
        slotStatus = reports[j].status;
        break;
      }
    }

    var cls = slotStatus === 'on' ? 'on' : slotStatus === 'off' ? 'off' : slotStatus === 'fluctuating' ? 'flicker' : '';
    cells += '<div class="pattern-cell ' + cls + '" title="' + (24-h) + 'h ago: ' + slotStatus + '"></div>';
  }

  document.getElementById('patternGrid').innerHTML = cells;
}

// ── SHARE ─────────────────────────────────────────────────────
function shareStatus() {
  var card = document.getElementById('statusCard');
  var word = document.getElementById('statusWord').textContent;
  var hood = currentHood || 'my neighborhood';
  var dur  = document.getElementById('statusDuration').textContent;
  var msg = '⚡ ' + word + ' in ' + hood + '!\n' + dur + '\n\nReported on Nearby app — nearby-navy.vercel.app';
  var url = 'https://wa.me/?text=' + encodeURIComponent(msg);
  window.open(url, '_blank');
}

// ── REALTIME ──────────────────────────────────────────────────
function startRealtime() {
  try {
    realtimeChannel = sb.channel('light-status-live')
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'light_status'
      }, function(payload) {
        var d = payload.new;
        if (!d) return;
        if (d.neighborhood === currentHood) {
          renderStatus(d);
        }
        loadOtherAreas();
        var msgs = { on: '💡 Light ON', off: '🌑 Light OFF', fluctuating: '⚡ Flickering' };
        if (d.neighborhood !== currentHood) {
          NearbyPush.show(d.neighborhood, msgs[d.status] || 'Status updated', '⚡');
        }
      })
      .subscribe();
  } catch(e) {}
}

// ── HELPERS ───────────────────────────────────────────────────
function timeAgo(ts) {
  if (!ts) return '';
  var diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2800);
}

init();
