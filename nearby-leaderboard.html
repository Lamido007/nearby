<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Leaderboard — Nearby</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --cream:#F5F0E8;--warm-white:#FDFAF4;--terracotta:#C4622D;
  --terracotta-light:#E07A4A;--navy:#1A2332;--sage:#7A9E7E;
  --amber:#E8A838;--gold:#D4AF37;--mid:#4A5568;--light:#8A96A8;
}
body{background:var(--cream);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:80px;}

/* HEADER */
.header{
  background:linear-gradient(135deg,var(--navy) 0%,#2D3F5C 100%);
  padding:20px 16px 28px;
}
.header-inner{max-width:480px;margin:0 auto;}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.back-btn{background:none;border:none;color:rgba(255,255,255,.7);font-size:20px;cursor:pointer;}
.page-title{font-family:'Playfair Display',serif;font-size:26px;color:#fff;font-weight:700;line-height:1.2;}
.page-sub{font-size:13px;color:rgba(255,255,255,.6);margin-top:4px;}

/* REFRESH ROW */
.refresh-row{display:flex;align-items:center;justify-content:space-between;margin-top:16px;}
.refresh-btn{
  display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 14px;
  color:rgba(255,255,255,.8);font-size:12px;font-weight:600;cursor:pointer;
}
.last-updated{font-size:11px;color:rgba(255,255,255,.4);}

/* TOP 3 PODIUM */
.podium{max-width:480px;margin:0 auto;padding:20px 16px 4px;}
.podium-row{display:flex;align-items:flex-end;justify-content:center;gap:10px;}
.podium-item{display:flex;flex-direction:column;align-items:center;flex:1;}
.podium-card{
  width:100%;background:var(--warm-white);border-radius:14px;padding:14px 8px;
  text-align:center;border:2px solid transparent;position:relative;
}
.podium-item.rank-1 .podium-card{border-color:var(--gold);background:#FFFBEF;}
.podium-item.rank-2 .podium-card{border-color:#C0C0C0;background:#FAFAFA;}
.podium-item.rank-3 .podium-card{border-color:#CD7F32;background:#FFF8F5;}
.podium-rank{font-size:28px;margin-bottom:4px;}
.podium-name{font-size:12px;font-weight:700;color:var(--navy);line-height:1.2;margin-bottom:4px;}
.podium-score{font-size:18px;font-weight:700;color:var(--terracotta);}
.podium-score-label{font-size:10px;color:var(--light);}
.podium-city{font-size:10px;color:var(--light);margin-top:2px;}
.podium-height{background:var(--navy);border-radius:4px 4px 0 0;width:40px;margin-top:8px;}
.rank-1 .podium-height{height:40px;background:var(--gold);}
.rank-2 .podium-height{height:28px;background:#C0C0C0;}
.rank-3 .podium-height{height:20px;background:#CD7F32;}

/* REST OF LIST */
.list-section{max-width:480px;margin:0 auto;padding:0 16px;}
.section-label{font-size:11px;font-weight:700;color:var(--light);letter-spacing:.08em;text-transform:uppercase;margin:16px 0 10px;}

.rank-row{
  background:var(--warm-white);border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;margin-bottom:8px;
  border:1px solid rgba(0,0,0,.06);transition:all .2s;
}
.rank-num{
  width:32px;height:32px;border-radius:10px;background:var(--cream);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--mid);flex-shrink:0;
}
.rank-info{flex:1;}
.rank-name{font-size:14px;font-weight:700;color:var(--navy);}
.rank-city{font-size:12px;color:var(--light);}
.rank-right{text-align:right;}
.rank-score{font-size:16px;font-weight:700;color:var(--terracotta);}
.rank-change{font-size:11px;display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:2px;}
.change-up{color:var(--sage);}
.change-down{color:#DC2626;}
.change-same{color:var(--light);}

/* STATS MINI */
.stats-row{display:flex;gap:8px;margin-top:6px;}
.stat-mini{font-size:10px;color:var(--light);display:flex;align-items:center;gap:2px;}

/* MY NEIGHBORHOOD CARD */
.my-hood-card{
  background:linear-gradient(135deg,var(--terracotta),var(--terracotta-light));
  border-radius:14px;padding:16px;margin:0 16px 16px;max-width:448px;margin-left:auto;margin-right:auto;
}
.my-hood-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.my-hood-name{font-size:20px;font-weight:700;color:#fff;font-family:'Playfair Display',serif;}
.my-hood-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.my-hood-score{font-size:28px;font-weight:700;color:#fff;}
.my-hood-rank{font-size:13px;color:rgba(255,255,255,.8);text-align:right;}

/* EMPTY / LOADING */
.loading{text-align:center;padding:60px 20px;color:var(--light);}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid rgba(196,98,45,.2);
  border-top-color:var(--terracotta);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);
  display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;
  color:rgba(255,255,255,0.5);font-size:10px;font-weight:600;cursor:pointer;
  text-decoration:none;gap:3px;transition:color .2s;}
.nav-item.active{color:var(--terracotta-light);}
.nav-icon{font-size:20px;line-height:1;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="back-row">
      <button class="back-btn" onclick="history.back()">←</button>
    </div>
    <div class="page-title">🏆 Leaderboard</div>
    <div class="page-sub">Weekly neighborhood rankings</div>
    <div class="refresh-row">
      <button class="refresh-btn" onclick="loadLeaderboard()">🔄 Refresh</button>
      <span class="last-updated" id="lastUpdated">Loading…</span>
    </div>
  </div>
</div>

<!-- LOADING -->
<div id="loadingView" class="loading">
  <div class="spinner"></div><br>Loading rankings…
</div>

<!-- MAIN CONTENT -->
<div id="mainContent" style="display:none;">

  <!-- MY NEIGHBORHOOD -->
  <div class="my-hood-card" id="myHoodCard" style="display:none;margin-top:16px;">
    <div class="my-hood-label">Your neighborhood</div>
    <div class="my-hood-name" id="myHoodName">—</div>
    <div class="my-hood-row">
      <div>
        <div class="my-hood-score" id="myHoodScore">—</div>
        <div style="font-size:11px;color:rgba(255,255,255,.7)">Nearby Points</div>
      </div>
      <div class="my-hood-rank">
        <div id="myHoodRank" style="font-size:22px;font-weight:700;color:#fff;">—</div>
        <div style="font-size:11px;color:rgba(255,255,255,.7)">Rank this week</div>
      </div>
    </div>
  </div>

  <!-- TOP 3 PODIUM -->
  <div class="podium">
    <div class="section-label">Top Neighborhoods</div>
    <div class="podium-row" id="podiumRow"></div>
  </div>

  <!-- REST OF LIST -->
  <div class="list-section">
    <div class="section-label" id="restLabel"></div>
    <div id="restList"></div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="nav-item" href="nearby-feed.html"><span class="nav-icon">🏠</span>Home</a>
  <a class="nav-item" href="nearby-search.html"><span class="nav-icon">🔍</span>Search</a>
  <a class="nav-item active" href="nearby-leaderboard.html"><span class="nav-icon">🏆</span>Rank</a>
  <a class="nav-item" href="nearby-messages.html"><span class="nav-icon">💬</span>Messages</a>
  <a class="nav-item" href="nearby-profile.html"><span class="nav-icon">👤</span>Profile</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
var currentUser = null;

async function init() {
  var session = await getSession();
  if (!session) { window.location.href = 'nearby-auth.html'; return; }
  currentUser = await getCurrentUser();
  loadLeaderboard();
}

async function loadLeaderboard() {
  document.getElementById('loadingView').style.display = 'block';
  document.getElementById('mainContent').style.display = 'none';

  // Recalculate scores first
  try { await sb.rpc('recalculate_neighborhood_scores'); } catch(e) {}
  try { await sb.rpc('update_weekly_ranks'); } catch(e) {}

  var res = await sb.from('neighborhood_scores')
    .select('*')
    .order('score', { ascending: false })
    .limit(50);

  document.getElementById('loadingView').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';

  if (!res.data || !res.data.length) return;

  var data = res.data;
  var now = new Date();
  document.getElementById('lastUpdated').textContent = 'Updated just now';

  // My neighborhood highlight
  if (currentUser && currentUser.neighborhood) {
    var myHood = data.find(function(d) { return d.neighborhood === currentUser.neighborhood; });
    if (myHood) {
      document.getElementById('myHoodCard').style.display = 'block';
      document.getElementById('myHoodName').textContent = myHood.neighborhood + (myHood.city ? ', ' + myHood.city : '');
      document.getElementById('myHoodScore').textContent = myHood.score || 0;
      var myRank = data.indexOf(myHood) + 1;
      document.getElementById('myHoodRank').textContent = '#' + myRank;
    }
  }

  // PODIUM — top 3
  var top3 = data.slice(0, 3);
  var podiumOrder = top3.length >= 3 ? [top3[1], top3[0], top3[2]] : top3;
  var podiumRanks = top3.length >= 3 ? [2, 1, 3] : [1];
  var podiumEmojis = ['🥈', '🥇', '🥉'];
  var podiumHtml = '';
  for (var i = 0; i < podiumOrder.length; i++) {
    var item = podiumOrder[i];
    var rank = podiumRanks[i];
    var emoji = podiumEmojis[i];
    podiumHtml += '<div class="podium-item rank-' + rank + '">'
      + '<div class="podium-card">'
      + '<div class="podium-rank">' + emoji + '</div>'
      + '<div class="podium-name">' + item.neighborhood + '</div>'
      + '<div class="podium-score">' + (item.score || 0) + '</div>'
      + '<div class="podium-score-label">pts</div>'
      + '<div class="podium-city">' + (item.city || '') + '</div>'
      + '</div>'
      + '<div class="podium-height"></div>'
      + '</div>';
  }
  document.getElementById('podiumRow').innerHTML = podiumHtml;

  // REST OF LIST (rank 4+)
  var rest = data.slice(3);
  if (!rest.length) return;
  document.getElementById('restLabel').textContent = 'All neighborhoods';
  var listHtml = '';
  for (var j = 0; j < rest.length; j++) {
    var row = rest[j];
    var rankNum = j + 4;
    var prevRank = row.last_week_rank || rankNum;
    var change = prevRank - rankNum;
    var changeHtml = '';
    if (change > 0) {
      changeHtml = '<span class="change-up">▲ ' + change + '</span>';
    } else if (change < 0) {
      changeHtml = '<span class="change-down">▼ ' + Math.abs(change) + '</span>';
    } else {
      changeHtml = '<span class="change-same">— same</span>';
    }
    var isMyHood = currentUser && row.neighborhood === currentUser.neighborhood;
    listHtml += '<div class="rank-row" style="' + (isMyHood ? 'border-color:var(--terracotta);border-width:2px;' : '') + '">'
      + '<div class="rank-num">' + rankNum + '</div>'
      + '<div class="rank-info">'
      + '<div class="rank-name">' + row.neighborhood + (isMyHood ? ' 📍' : '') + '</div>'
      + '<div class="rank-city">' + (row.city || '') + '</div>'
      + '<div class="stats-row">'
      + '<span class="stat-mini">👥 ' + (row.user_count || 0) + '</span>'
      + '<span class="stat-mini">📝 ' + (row.post_count || 0) + ' posts</span>'
      + '<span class="stat-mini">💼 ' + (row.job_count || 0) + ' jobs</span>'
      + '</div>'
      + '</div>'
      + '<div class="rank-right">'
      + '<div class="rank-score">' + (row.score || 0) + '</div>'
      + '<div class="rank-change">' + changeHtml + '</div>'
      + '</div>'
      + '</div>';
  }
  document.getElementById('restList').innerHTML = listHtml;
}

init();
</script>
</body>
</html>
